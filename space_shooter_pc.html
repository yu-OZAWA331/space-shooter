<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPACE SHOOTER</title><style>body{margin:0;background:#10182c;color:white;font-family:system-ui,sans-serif;display:flex;justify-content:center}main{width:min(94vw,520px);text-align:center}h1{margin:14px 0}header{display:flex;justify-content:space-between;padding:8px}#stage{position:relative;width:100%;aspect-ratio:3/4;max-height:75vh;background:#060d25;border-radius:12px;overflow:hidden}canvas{width:100%;height:100%;display:block}#overlay{position:absolute;inset:0;background:#03091dc9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}button{border:0;border-radius:12px;background:#2563eb;color:white;font-size:18px;padding:12px 28px;cursor:pointer}#controls{display:flex;gap:16px;margin-top:12px}#controls button{flex:1;touch-action:none;user-select:none}small{display:block;margin:12px;color:#b5c5e3}</style></head><body><main><h1>🚀 SPACE SHOOTER</h1><header><span>⭐ スコア <b id="score">0</b></span><span>❤️ ライフ <b id="lives">3</b></span><span>🏆 ベスト <b id="best">0</b></span></header><div id="stage"><canvas id="game" width="720" height="960"></canvas><div id="overlay"><div style="font-size:48px">🚀</div><h2 id="message">SPACE SHOOTER</h2><p id="description">左右キー / A・D で移動<br>弾は自動発射！</p><button id="start">▶ ゲームスタート</button></div></div><div id="controls"><button id="left">◀ 左</button><button id="right">右 ▶</button></div><small>PC：← → または A D で移動、スペースで開始・再挑戦<br>スマホ：左右のボタンを長押し</small></main><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');ctx.scale(2,2);const W=360,H=480;
const $=s=>document.querySelector(s),overlay=$('#overlay');let playing=false,score=0,lives=3,best=0,x=180,bullets=[],enemies=[],particles=[],stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,s:Math.random()*1.4+.4})),keys={left:false,right:false},last=0,spawn=0,fire=0,invuln=0,raf=0;
function start(){score=0;lives=3;x=180;bullets=[];enemies=[];particles=[];spawn=fire=invuln=0;$('#score').textContent=0;$('#lives').textContent=3;overlay.style.display='none';playing=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}$('#start').onclick=start;
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='Space'&&!playing)start()});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false});window.addEventListener('blur',()=>keys.left=keys.right=false);
for(const [id,dir] of [['#left','left'],['#right','right']]){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[dir]=true;el.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[dir]=false)}
function burst(px,py,color){for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,v=Math.random()*3+1;particles.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:25,color})}}
function end(){playing=false;best=Math.max(best,score);$('#best').textContent=best;$('#message').textContent='ゲームオーバー';$('#description').innerHTML='スコア：'+score+' 点<br>スペースキーでも再挑戦できます';$('#start').textContent='🔄 もう一度遊ぶ';overlay.style.display='flex'}
function loop(t){if(!playing)return;const dt=Math.min((t-last)/16.67,2);last=t;if(keys.left)x-=5.2*dt;if(keys.right)x+=5.2*dt;x=Math.max(19,Math.min(W-19,x));spawn+=dt;fire+=dt;invuln=Math.max(0,invuln-dt);if(fire>=11){fire=0;bullets.push({x,y:405})}if(spawn>Math.max(18,46-score/30)){spawn=0;enemies.push({x:20+Math.random()*(W-40),y:-25,r:15+Math.random()*6,s:1.5+Math.min(score/300,2.3)+Math.random()*.7,phase:Math.random()*6})}for(const s of stars){s.y+=s.s*dt;if(s.y>H)s.y=0}for(const b of bullets)b.y-=8*dt;for(const e of enemies){e.y+=e.s*dt;e.phase+=.035*dt;e.x+=Math.sin(e.phase)*.55*dt}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}for(const e of enemies){if(e.dead)continue;for(const b of bullets){if(!b.dead&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){e.dead=b.dead=true;score+=10;$('#score').textContent=score;burst(e.x,e.y,'#ffb347');break}}if(!e.dead&&invuln<=0&&Math.hypot(e.x-x,e.y-425)<e.r+14){e.dead=true;lives--;$('#lives').textContent=lives;invuln=75;burst(x,425,'#63dcff');if(lives<=0){end();break}}if(!e.dead&&e.y>H+25){e.dead=true;lives--;$('#lives').textContent=lives;if(lives<=0){end();break}}}bullets=bullets.filter(b=>!b.dead&&b.y>-10);enemies=enemies.filter(e=>!e.dead);particles=particles.filter(p=>p.life>0);draw();if(playing)raf=requestAnimationFrame(loop)}
function draw(){ctx.fillStyle='#060d25';ctx.fillRect(0,0,W,H);for(const s of stars){ctx.fillStyle='#b9d2ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}for(const b of bullets){ctx.fillStyle='#6df8ff';ctx.shadowColor='#33eaff';ctx.shadowBlur=12;ctx.fillRect(b.x-2,b.y-12,4,15);ctx.shadowBlur=0}for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle='#ff556c';ctx.shadowColor='#ff365f';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(-19,-9);ctx.lineTo(-8,-6);ctx.lineTo(0,-17);ctx.lineTo(8,-6);ctx.lineTo(19,-9);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffd17b';ctx.fillRect(-4,-4,8,8);ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/25);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;if(invuln<=0||Math.floor(invuln/5)%2===0){ctx.save();ctx.translate(x,425);ctx.fillStyle='#ffab40';ctx.beginPath();ctx.moveTo(-7,13);ctx.lineTo(0,27+Math.random()*9);ctx.lineTo(7,13);ctx.fill();ctx.fillStyle='#44caff';ctx.shadowColor='#00baff';ctx.shadowBlur=16;ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(11,-4);ctx.lineTo(21,14);ctx.lineTo(6,9);ctx.lineTo(0,16);ctx.lineTo(-6,9);ctx.lineTo(-21,14);ctx.lineTo(-11,-4);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#e9fbff';ctx.beginPath();ctx.ellipse(0,-5,5,9,0,0,7);ctx.fill();ctx.restore()}}draw();
</script></body></html>
