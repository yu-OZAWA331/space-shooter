<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPACE SHOOTER</title><style>body{margin:0;background:#10182c;color:white;font-family:system-ui,sans-serif;display:flex;justify-content:center}main{width:min(94vw,520px);text-align:center}h1{margin:14px 0}header{display:flex;justify-content:space-between;padding:8px}#stage{position:relative;width:100%;aspect-ratio:3/4;max-height:75vh;background:#060d25;border-radius:12px;overflow:hidden}canvas{width:100%;height:100%;display:block}#overlay{position:absolute;inset:0;background:#03091dc9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}button{border:0;border-radius:12px;background:#2563eb;color:white;font-size:18px;padding:12px 28px;cursor:pointer}#controls{display:flex;gap:16px;margin-top:12px}#controls button{flex:1;touch-action:none;user-select:none}small{display:block;margin:12px;color:#b5c5e3}main{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}button,canvas{touch-action:none;-webkit-touch-callout:none}h1{font-size:22px;margin:6px 0}header{flex-wrap:wrap;gap:5px;font-size:13px}#stage{max-height:60dvh;width:auto;margin:auto;aspect-ratio:3/4}#overlay{gap:8px;padding:12px;overflow:auto}#overlay h2,#overlay p{margin:3px}#overlay button{font-size:15px;padding:9px 14px;width:90%}#controls{margin-top:6px}#pause{font-size:13px;padding:5px 10px}small{margin:5px;font-size:11px} </style></head><body><main><h1>🚀 SPACE SHOOTER DX</h1><header><span>⭐ <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span><span>🏆 <b id="best">0</b></span><span>攻撃 Lv.<b id="level">1</b></span><button id="pause">Ⅱ 停止</button></header><div id="stage"><canvas id="game" width="720" height="960"></canvas><div id="overlay"></div></div><div id="controls"><button id="left">◀ 左</button><button id="right">右 ▶</button></div><small>PC：← → / A D ・ Pで停止　スマホ：左右ボタン長押し<br>弾は自動発射・緑のPで強化</small></main><script>
const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d'),overlay=$('#overlay');ctx.scale(2,2);const W=360,H=480;
const configs={EASY:{speed:.75,spawn:1.35,shot:0.45,drop:.18},NORMAL:{speed:1,spawn:1,shot:1,drop:.12},HARD:{speed:1.3,spawn:.72,shot:1.7,drop:.07}};
let mode='NORMAL',state='title',score=0,lives=3,level=1,x=180,bullets=[],enemies=[],particles=[],items=[],shots=[],stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,s:Math.random()*1.4+.4})),keys={left:false,right:false},last=0,spawn=0,fire=0,invuln=0,raf=0,records={EASY:0,NORMAL:0,HARD:0};
try{for(const m of Object.keys(records))records[m]=Math.max(0,Number(localStorage.getItem('space_shooter_dx_best_'+m))||0)}catch(e){}
function save(){if(score>records[mode]){records[mode]=score;try{localStorage.setItem('space_shooter_dx_best_'+mode,String(score))}catch(e){}}}
function hud(){ $('#score').textContent=score;$('#lives').textContent=lives;$('#best').textContent=records[mode];$('#level').textContent=level;$('#pause').disabled=state!=='play';}
function clearKeys(){keys.left=keys.right=false}function stop(){cancelAnimationFrame(raf);clearKeys()}
function menu(title,desc,buttons){overlay.replaceChildren();let h=document.createElement('h2');h.textContent=title;overlay.append(h);let p=document.createElement('p');p.textContent=desc;overlay.append(p);for(const [label,fn] of buttons){let b=document.createElement('button');b.textContent=label;b.onclick=fn;overlay.append(b)}overlay.style.display='flex';hud()}
function title(){stop();state='title';menu('SPACE SHOOTER DX','難易度を選択',Object.keys(configs).map(m=>[m+'　🏆 '+records[m],()=>start(m)]))}
function start(m=mode){stop();mode=m;score=0;lives=3;level=1;x=180;bullets=[];enemies=[];particles=[];items=[];shots=[];spawn=fire=invuln=0;resume()}
function resume(){stop();state='play';overlay.style.display='none';hud();last=performance.now();raf=requestAnimationFrame(loop)}
function pause(){if(state!=='play')return;stop();state='pause';menu('PAUSE','ゲームを一時停止中',[['▶ 再開',resume],['最初からやり直す',()=>confirmAction(false)],['ギブアップ',()=>confirmAction(true)]])}
function confirmAction(quit){state='confirm';menu('確認',quit?'タイトルに戻りますか？':'最初からやり直しますか？',[['はい',()=>{save();quit?title():start()}],['いいえ',()=>{state='play';pause()}]])}
function end(){stop();state='end';save();menu('ゲームオーバー','スコア：'+score+'　ベスト：'+records[mode],[['もう一度遊ぶ',()=>start()],['タイトルへ',title]])}
$('#pause').onclick=pause;window.addEventListener('blur',()=>{clearKeys();pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD','KeyP','Escape'].includes(e.code)&&e.target.tagName!=='BUTTON')e.preventDefault();if(e.repeat&&['KeyP','Escape','Space'].includes(e.code))return;if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')pause();else if(state==='pause')resume()}if(e.code==='Space'&&e.target.tagName!=='BUTTON'){if(state==='title'||state==='end')start();else if(state==='pause')resume()}if(state==='play'){if(['ArrowLeft','KeyA'].includes(e.code))keys.left=true;if(['ArrowRight','KeyD'].includes(e.code))keys.right=true}});window.addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false});
$('main').addEventListener('contextmenu',e=>e.preventDefault());$('main').addEventListener('selectstart',e=>e.preventDefault());$('main').addEventListener('dblclick',e=>e.preventDefault());for(const [id,dir] of [['#left','left'],['#right','right']]){const el=$(id);let active=new Set();el.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play')return;active.add(e.pointerId);keys[dir]=true;el.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,e=>{active.delete(e.pointerId);keys[dir]=state==='play'&&active.size>0});el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});}
function burst(px,py,color){for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,v=Math.random()*3+1;particles.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:25,color})}}
function damage(){lives--;invuln=75;burst(x,425,'#63dcff');hud();if(lives<=0)end()}
function loop(t){if(state!=='play')return;const dt=Math.min((t-last)/16.67,2),c=configs[mode];last=t;if(keys.left)x-=5.2*dt;if(keys.right)x+=5.2*dt;x=Math.max(19,Math.min(W-19,x));spawn+=dt;fire+=dt;invuln=Math.max(0,invuln-dt);if(fire>=11){fire=0;let n=[1,2,3,5][level-1];for(let i=0;i<n;i++){let k=i-(n-1)/2;bullets.push({x:x+k*7,y:405,vx:k*.65})}}if(spawn>Math.max(18,46-score/30)*c.spawn){spawn=0;enemies.push({x:20+Math.random()*(W-40),y:-25,r:15+Math.random()*6,s:(1.5+Math.min(score/300,2.3)+Math.random()*.7)*c.speed,phase:Math.random()*6,fire:80+Math.random()*100})}for(const s of stars){s.y+=s.s*dt;if(s.y>H)s.y=0}for(const b of bullets){b.y-=8*dt;b.x+=b.vx*dt}for(const e of enemies){e.y+=e.s*dt;e.phase+=.035*dt;e.x+=Math.sin(e.phase)*.55*dt;e.fire-=dt*c.shot;if(e.fire<=0&&e.y>15&&e.y<350){e.fire=110+Math.random()*90;shots.push({x:e.x,y:e.y+12})}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}for(const e of enemies){if(e.dead)continue;for(const b of bullets){if(!b.dead&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){e.dead=b.dead=true;score+=10;level=Math.max(level,score>=500?4:score>=300?3:score>=100?2:1);if(Math.random()<c.drop)items.push({x:e.x,y:e.y});save();hud();burst(e.x,e.y,'#ffb347');break}}if(!e.dead&&invuln<=0&&Math.hypot(e.x-x,e.y-425)<e.r+14){e.dead=true;damage()}if(!e.dead&&e.y>H+25&&state==='play'){e.dead=true;damage()}if(state!=='play')break}if(state==='play'){for(const b of shots){b.y+=3.1*c.speed*dt;if(Math.hypot(b.x-x,b.y-425)<16){b.dead=true;if(invuln<=0)damage()}if(state!=='play')break}}if(state==='play')for(const a of items){a.y+=2*dt;if(Math.hypot(a.x-x,a.y-425)<25){a.dead=true;level=Math.min(4,level+1);hud();burst(a.x,a.y,'#45f59a')}}bullets=bullets.filter(b=>!b.dead&&b.y>-20&&b.x>-20&&b.x<W+20);enemies=enemies.filter(e=>!e.dead);particles=particles.filter(p=>p.life>0);items=items.filter(a=>!a.dead&&a.y<H+20);shots=shots.filter(b=>!b.dead&&b.y<H+20);draw();if(state==='play')raf=requestAnimationFrame(loop)}
function draw(){ctx.fillStyle='#060d25';ctx.fillRect(0,0,W,H);for(const s of stars){ctx.fillStyle='#b9d2ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}for(const b of bullets){ctx.fillStyle='#6df8ff';ctx.shadowColor='#33eaff';ctx.shadowBlur=12;ctx.fillRect(b.x-2,b.y-12,4,15);ctx.shadowBlur=0}for(const a of items){ctx.fillStyle='#45f59a';ctx.fillRect(a.x-9,a.y-9,18,18);ctx.fillStyle='#062b22';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('P',a.x,a.y+5)}for(const b of shots){ctx.fillStyle='#ff914d';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()}for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle='#ff556c';ctx.shadowColor='#ff365f';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(-19,-9);ctx.lineTo(-8,-6);ctx.lineTo(0,-17);ctx.lineTo(8,-6);ctx.lineTo(19,-9);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffd17b';ctx.fillRect(-4,-4,8,8);ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/25);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;if(invuln<=0||Math.floor(invuln/5)%2===0){ctx.save();ctx.translate(x,425);ctx.fillStyle='#ffab40';ctx.beginPath();ctx.moveTo(-7,13);ctx.lineTo(0,27+Math.random()*9);ctx.lineTo(7,13);ctx.fill();ctx.fillStyle='#44caff';ctx.shadowColor='#00baff';ctx.shadowBlur=16;ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(11,-4);ctx.lineTo(21,14);ctx.lineTo(6,9);ctx.lineTo(0,16);ctx.lineTo(-6,9);ctx.lineTo(-21,14);ctx.lineTo(-11,-4);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#e9fbff';ctx.beginPath();ctx.ellipse(0,-5,5,9,0,0,7);ctx.fill();ctx.restore()}}draw();title();
</script></body></html>
